<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>MAESTRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" crossorigin></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin></script>
<style>
  body { margin: 0; font-family: 'Inter', sans-serif; background:#F1F5F9; }
  button { -webkit-tap-highlight-color: transparent; }
  .maestro-section-title { font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:-0.01em; }
  .maestro-quick-btn { transition: transform .15s ease, box-shadow .15s ease; }
  .maestro-quick-btn:active { transform: scale(.98); }
  .maestro-nav-safe { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  .maestro-bottom-nav { padding-bottom: env(safe-area-inset-bottom); }

</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;


const STORAGE_KEY = "maestro:data-v1";              // cache lokal (fallback offline)
const SUPABASE_CONFIG_KEY = "maestro:supabase-config"; // simpan URL + anon key project supabase
const SUPABASE_TABLE = "maestro_state";
const SUPABASE_ROW_ID = "main";
// Kredensial bawaan MAESTRO — semua device yang buka file ini otomatis konek ke project Supabase yang sama.
const DEFAULT_SUPABASE_URL = "https://wztbmucqmuwxpnahladz.supabase.co";
const DEFAULT_SUPABASE_KEY = "sb_publishable_8Dg5TjjJYDKmeiyPF2NN7A_2dF5VcUi";
const BULAN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const BULAN_FULL = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];


const SETUP_SQL = `create table if not exists maestro_state (
  id text primary key,
  payload jsonb not null,
  updated_at timestamptz not null default now()
);

alter table maestro_state enable row level security;

create policy "maestro allow all"
on maestro_state for all
using (true) with check (true);`;

function uid(p) { return `${p}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }
function formatRupiah(n) {
  const v = Math.round(n || 0);
  return (v < 0 ? "-Rp " : "Rp ") + Math.abs(v).toLocaleString("id-ID");
}
function formatRupiahCompact(n) {
  const v = Math.round(n || 0);
  if (v === 0) return "0";
  if (v % 1000000 === 0) return `${v / 1000000}jt`;
  if (v % 1000 === 0) return `${(v / 1000).toLocaleString("id-ID")}rb`;
  if (v >= 1000000) return `${(v / 1000000).toLocaleString("id-ID", { maximumFractionDigits: 1 })}jt`;
  if (v >= 1000) return `${(v / 1000).toLocaleString("id-ID", { maximumFractionDigits: 1 })}rb`;
  return String(v);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDateID(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
}
function payKey(memberId, year, month) { return `${memberId}:${year}-${month}`; }

const defaultGroup = (name, amount) => ({
  name, defaultAmount: amount, openingBalance: 0, openingBalanceNote: "", members: [], payments: {}, expenses: [],
});

const emptyData = {
  appName: "MAESTRO",
  appTagline: "easy does it",
  auth: { username: "admin", password: "admin123" },
  groups: { A: defaultGroup("Group A", 50000), B: defaultGroup("Group B", 100000) },
  activityLog: [],
};

const STATUS_STYLE = {
  paid: { label: "Paid", bg: "#DCFCE7", fg: "#15803D" },
  unpaid: { label: "Belum Bayar", bg: "#FEE2E2", fg: "#B91C1C" },
  leave: { label: "Vacation", bg: "#FEF3C7", fg: "#B45309" },
};
const YEARLY_CELL_STYLE = {
  paid: { bg: "#DCFCE7", fg: "#15803D", label: "Lunas" },
  unpaid: { bg: "#FEE2E2", fg: "#B91C1C", label: "Belum Bayar" },
  leave: { bg: "#FEF3C7", fg: "#B45309", label: "Cuti" },
};

function Maestro() {
  const [data, setData] = useState(emptyData);
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);

  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [loginUser, setLoginUser] = useState("");
  const [loginPass, setLoginPass] = useState("");
  const [loginError, setLoginError] = useState("");

  const [selectedGroup, setSelectedGroup] = useState("A");
  const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
  const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
  const [tab, setTab] = useState("dashboard");

  const [memberModal, setMemberModal] = useState(null); // memberId
  const [customAmount, setCustomAmount] = useState("");
  const [useCustom, setUseCustom] = useState(false);

  const [newMemberName, setNewMemberName] = useState("");
  const [expDate, setExpDate] = useState(todayISO());
  const [expDesc, setExpDesc] = useState("");
  const [expAmount, setExpAmount] = useState("");

  const canvasHost = useRef(null);
  const restoreInputRef = useRef(null);
  const [reportView, setReportView] = useState("monthly");
  const [restoreMsg, setRestoreMsg] = useState("");
  const [exportLinks, setExportLinks] = useState([]);

  // ---- Supabase config & client ----
  const [supaConfig, setSupaConfig] = useState(null);       // { url, key } | null
  const [supaConfigChecked, setSupaConfigChecked] = useState(false);
  const [syncStatus, setSyncStatus] = useState("idle");     // idle | loading | saving | saved | error | offline
  const [setupUrl, setSetupUrl] = useState("");
  const [setupKey, setSetupKey] = useState("");
  const [setupError, setSetupError] = useState("");
  const [setupBusy, setSetupBusy] = useState(false);
  const clientRef = useRef(null);
  const saveTimerRef = useRef(null);
  const skipNextSaveRef = useRef(false);
  const lastSyncedRef = useRef(null); // JSON string of the payload currently in sync with Supabase

  // Load supabase config saved on this device (fallback ke kredensial bawaan MAESTRO)
  useEffect(() => {
    try {
      const raw = localStorage.getItem(SUPABASE_CONFIG_KEY);
      if (raw) {
        const cfg = JSON.parse(raw);
        if (cfg && cfg.url && cfg.key) { setSupaConfig(cfg); setSupaConfigChecked(true); return; }
      }
    } catch (e) { /* ignore */ }
    if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_KEY) {
      const cfg = { url: DEFAULT_SUPABASE_URL, key: DEFAULT_SUPABASE_KEY };
      try { localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
      setSupaConfig(cfg);
    }
    setSupaConfigChecked(true);
  }, []);

  // Once config is known, connect + load data from Supabase (with local cache fallback)
  useEffect(() => {
    if (!supaConfigChecked) return;
    if (!supaConfig) { setLoaded(true); return; }

    let cancelled = false;
    setSyncStatus("loading");
    try {
      clientRef.current = window.supabase.createClient(supaConfig.url, supaConfig.key);
    } catch (e) {
      setSyncStatus("error");
      setLoaded(true);
      return;
    }
    const client = clientRef.current;

    (async () => {
      try {
        const { data: row, error } = await client
          .from(SUPABASE_TABLE).select("payload").eq("id", SUPABASE_ROW_ID).maybeSingle();
        if (error) throw error;
        if (cancelled) return;

        if (row && row.payload) {
          const merged = { ...emptyData, ...row.payload };
          lastSyncedRef.current = JSON.stringify(merged);
          setData(merged);
        } else {
          // No row yet: migrate local cache (kalau ada data lama di HP ini) atau mulai kosong
          let initial = emptyData;
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) initial = { ...emptyData, ...JSON.parse(raw) };
          } catch (e2) { /* ignore */ }
          const { error: insErr } = await client
            .from(SUPABASE_TABLE)
            .upsert({ id: SUPABASE_ROW_ID, payload: initial, updated_at: new Date().toISOString() });
          if (insErr) throw insErr;
          lastSyncedRef.current = JSON.stringify(initial);
          setData(initial);
        }
        setSyncStatus("saved");
      } catch (e) {
        setSyncStatus("error");
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();

    // Realtime: kalau device lain mengubah data, ikut update di sini
    const channel = client
      .channel("maestro_state_changes")
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: SUPABASE_TABLE, filter: `id=eq.${SUPABASE_ROW_ID}` },
        (payload) => {
          const incoming = payload.new && payload.new.payload;
          if (!incoming) return;
          const incomingStr = JSON.stringify(incoming);
          if (incomingStr === lastSyncedRef.current) return; // perubahan dari device ini sendiri
          skipNextSaveRef.current = true;
          lastSyncedRef.current = incomingStr;
          setData({ ...emptyData, ...incoming });
        })
      .subscribe();

    return () => { cancelled = true; try { client.removeChannel(channel); } catch (e) { /* ignore */ } };
  }, [supaConfig, supaConfigChecked]);

  // Save to Supabase (debounced) whenever data changes
  useEffect(() => {
    if (!loaded || !supaConfig) return;
    // Selalu simpan cache lokal sebagai cadangan offline
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }

    if (skipNextSaveRef.current) { skipNextSaveRef.current = false; return; }
    const payloadStr = JSON.stringify(data);
    if (payloadStr === lastSyncedRef.current) return;

    setSyncStatus("saving");
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      try {
        const client = clientRef.current;
        if (!client) return;
        const { error } = await client
          .from(SUPABASE_TABLE)
          .upsert({ id: SUPABASE_ROW_ID, payload: data, updated_at: new Date().toISOString() });
        if (error) throw error;
        lastSyncedRef.current = payloadStr;
        setSyncStatus("saved");
        setSaveError(false);
      } catch (e) {
        setSyncStatus("error");
        setSaveError(true);
      }
    }, 800);
    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [data, loaded, supaConfig]);

  const handleSaveSetup = async () => {
    setSetupError("");
    const url = setupUrl.trim().replace(/\/+$/, "");
    const key = setupKey.trim();
    if (!url || !key) { setSetupError("URL dan anon key wajib diisi."); return; }
    setSetupBusy(true);
    try {
      const testClient = window.supabase.createClient(url, key);
      const { error } = await testClient.from(SUPABASE_TABLE).select("id").limit(1);
      if (error && error.code !== "PGRST116") {
        // PGRST116 = no rows, itu bukan masalah. Error lain berarti tabel/kredensial belum benar.
        if (String(error.message || "").toLowerCase().includes("does not exist")) {
          setSetupError('Tabel "maestro_state" belum ada. Jalankan dulu SQL di bawah ini di Supabase SQL Editor.');
        } else {
          setSetupError(`Gagal konek: ${error.message || "cek kembali URL & key"}`);
        }
        setSetupBusy(false);
        return;
      }
      const cfg = { url, key };
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify(cfg));
      setSupaConfig(cfg);
    } catch (e) {
      setSetupError("Gagal konek ke Supabase. Cek kembali URL & anon key.");
    }
    setSetupBusy(false);
  };

  const logActivity = useCallback(() => {}, []);

  const handleClearLog = () => {
    if (!confirm("Hapus semua log aktivitas? Data anggota, pembayaran, dan kas tidak akan terpengaruh.")) return;
    setData((d) => ({ ...d, activityLog: [] }));
  };

  const group = data.groups[selectedGroup];

  const handleLogin = () => {
    if (loginUser === data.auth.username && loginPass === data.auth.password) {
      setIsLoggedIn(true);
      setLoginError("");
    } else {
      setLoginError("Username atau password salah.");
    }
  };

  // ---- Derived data for selected group/month/year ----
  const memberRows = useMemo(() => {
    return group.members.map((m) => {
      const p = group.payments[payKey(m.id, selectedYear, selectedMonth)];
      return {
        ...m,
        status: p ? p.status : "unpaid",
        amount: p && p.status === "paid" ? p.amount : null,
              };
    });
  }, [group, selectedYear, selectedMonth]);

  const paidCount = memberRows.filter((m) => m.status === "paid").length;
  const leaveCount = memberRows.filter((m) => m.status === "leave").length;
  const unpaidCount = memberRows.length - paidCount - leaveCount;

  const monthlyIncome = memberRows.filter((m) => m.status === "paid").reduce((s, m) => s + (m.amount || 0), 0);
  const monthlyExpenses = useMemo(
    () => group.expenses.filter((e) => e.date.slice(0, 7) === `${selectedYear}-${String(selectedMonth + 1).padStart(2, "0")}`).reduce((s, e) => s + e.amount, 0),
    [group, selectedYear, selectedMonth]
  );

  const allTimeIncome = useMemo(
    () => Object.values(group.payments).filter((p) => p.status === "paid").reduce((s, p) => s + p.amount, 0),
    [group]
  );
  const allTimeExpenses = useMemo(() => group.expenses.reduce((s, e) => s + e.amount, 0), [group]);
  const cashBalance = group.openingBalance + allTimeIncome - allTimeExpenses;

  // ---- Member actions ----
  const updateGroup = (patch) => {
    setData((d) => ({ ...d, groups: { ...d.groups, [selectedGroup]: { ...d.groups[selectedGroup], ...patch(d.groups[selectedGroup]) } } }));
  };

  const addMember = () => {
    if (!newMemberName.trim()) return;
    const m = { id: uid("m"), nama: newMemberName.trim() };
    updateGroup((g) => ({ members: [...g.members, m] }));
    logActivity(`${m.nama} ditambahkan ke ${group.name}`);
    setNewMemberName("");
  };

  const removeMember = (id, nama) => {
    updateGroup((g) => {
      const payments = { ...g.payments };
      Object.keys(payments).forEach((k) => { if (k.startsWith(`${id}:`)) delete payments[k]; });
      return { members: g.members.filter((m) => m.id !== id), payments };
    });
    logActivity(`${nama} dihapus dari ${group.name}`);
  };

  const markPaid = (memberId, nama, amount) => {
    updateGroup((g) => ({
      payments: { ...g.payments, [payKey(memberId, selectedYear, selectedMonth)]: { status: "paid", amount } },
    }));
    logActivity(`${nama} bayar ${formatRupiah(amount)} (${BULAN_FULL[selectedMonth]} ${selectedYear})`);
    setMemberModal(null); setUseCustom(false); setCustomAmount("");
  };

  const markLeave = (memberId, nama) => {
    updateGroup((g) => ({ payments: { ...g.payments, [payKey(memberId, selectedYear, selectedMonth)]: { status: "leave" } } }));
    logActivity(`${nama} ditandai Vacation (${BULAN_FULL[selectedMonth]} ${selectedYear})`);
    setMemberModal(null);
  };

  const markUnpaid = (memberId, nama) => {
    updateGroup((g) => {
      const payments = { ...g.payments };
      delete payments[payKey(memberId, selectedYear, selectedMonth)];
      return { payments };
    });
    logActivity(`${nama} dibatalkan, kembali ke Belum Bayar (${BULAN_FULL[selectedMonth]} ${selectedYear})`);
    setMemberModal(null); setUseCustom(false); setCustomAmount("");
  };

  // ---- Expenses ----
  const addExpense = () => {
    const nom = parseFloat(String(expAmount).replace(/[^0-9.-]/g, ""));
    if (!expDesc.trim() || !nom || nom <= 0) return;
    updateGroup((g) => ({ expenses: [{ id: uid("e"), date: expDate, description: expDesc.trim(), amount: nom }, ...g.expenses] }));
    logActivity(`Pengeluaran: ${expDesc.trim()} ${formatRupiah(nom)} (${group.name})`);
    setExpDesc(""); setExpAmount("");
  };
  const removeExpense = (id, desc) => {
    updateGroup((g) => ({ expenses: g.expenses.filter((e) => e.id !== id) }));
    logActivity(`Pengeluaran dihapus: ${desc}`);
  };

  const yearlyBreakdown = useMemo(() => {
    return BULAN.map((label, month) => {
      let income = 0;
      group.members.forEach((m) => {
        const p = group.payments[payKey(m.id, selectedYear, month)];
        if (p && p.status === "paid") income += p.amount;
      });
      const expense = group.expenses
        .filter((e) => e.date.slice(0, 7) === `${selectedYear}-${String(month + 1).padStart(2, "0")}`)
        .reduce((s, e) => s + e.amount, 0);
      return { label, income, expense, net: income - expense };
    });
  }, [group, selectedYear]);

  const memberYearlyMatrix = useMemo(() => {
    return group.members.map((m) => {
      let total = 0;
      const months = BULAN.map((_, month) => {
        const p = group.payments[payKey(m.id, selectedYear, month)];
        if (p && p.status === "paid") { total += p.amount; return { status: "paid", amount: p.amount }; }
        if (p && p.status === "leave") return { status: "leave", amount: 0 };
        return { status: "unpaid", amount: 0 };
      });
      return { id: m.id, nama: m.nama, months, total };
    });
  }, [group, selectedYear]);

  const yearlyIncomeTotal = useMemo(() => yearlyBreakdown.reduce((s, r) => s + r.income, 0), [yearlyBreakdown]);
  const yearlyExpenseTotal = useMemo(() => yearlyBreakdown.reduce((s, r) => s + r.expense, 0), [yearlyBreakdown]);

  const groupComparison = useMemo(() => {
    return ["A", "B"].map((gk) => {
      const g = data.groups[gk];
      const income = Object.values(g.payments).filter((p) => p.status === "paid").reduce((s, p) => s + p.amount, 0);
      const expense = g.expenses.reduce((s, e) => s + e.amount, 0);
      return {
        key: gk, name: g.name, members: g.members.length, income, expense,
        balance: g.openingBalance + income - expense,
        openingBalance: g.openingBalance, openingBalanceNote: g.openingBalanceNote,
      };
    });
  }, [data.groups]);

  // ---- Excel export: one separate, polished workbook per group, full selected year ----
  const handleExportExcel = (groupKey = selectedGroup) => {
    const exportGroup = data.groups[groupKey];
    const yr = selectedYear;
    const monthCount = BULAN.length;
    // Main table: A=No, B=Nama, C:N=Jan-Des. Tidak ada kolom Total per anggota.
    const lastCol = 2 + monthCount;
    const colLetter = (n) => {
      let out = "";
      while (n > 0) { const r = (n - 1) % 26; out = String.fromCharCode(65 + r) + out; n = Math.floor((n - 1) / 26); }
      return out;
    };
    const lastColLetter = colLetter(lastCol);

    const borderColor = "CBD5E1";
    const thinBorder = {
      top: { style: "thin", color: { rgb: borderColor } },
      bottom: { style: "thin", color: { rgb: borderColor } },
      left: { style: "thin", color: { rgb: borderColor } },
      right: { style: "thin", color: { rgb: borderColor } },
    };
    const titleStyle = {
      font: { bold: true, sz: 16, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: "4F46E5" } },
      alignment: { horizontal: "center", vertical: "center" },
      border: thinBorder,
    };
    const subtitleStyle = {
      font: { bold: true, sz: 12, color: { rgb: "334155" } },
      fill: { fgColor: { rgb: "EEF2FF" } },
      alignment: { horizontal: "center", vertical: "center" },
      border: thinBorder,
    };
    const sectionStyle = {
      font: { bold: true, sz: 12, color: { rgb: "3730A3" } },
      fill: { fgColor: { rgb: "E0E7FF" } },
      alignment: { horizontal: "left", vertical: "center" },
      border: thinBorder,
    };
    const headerStyle = {
      font: { bold: true, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: "6366F1" } },
      alignment: { horizontal: "center", vertical: "center", wrapText: true },
      border: thinBorder,
    };
    const labelStyle = {
      font: { bold: true, color: { rgb: "334155" } },
      fill: { fgColor: { rgb: "F8FAFC" } },
      alignment: { vertical: "center", wrapText: true },
      border: thinBorder,
    };
    const bodyStyle = {
      border: thinBorder,
      alignment: { vertical: "center", wrapText: true },
    };
    const centerStyle = {
      ...bodyStyle,
      alignment: { horizontal: "center", vertical: "center", wrapText: true },
    };
    const moneyStyle = {
      ...bodyStyle,
      numFmt: '"Rp" #,##0',
      alignment: { horizontal: "right", vertical: "center" },
    };
    const moneyBoldStyle = {
      ...moneyStyle,
      font: { bold: true, color: { rgb: "111827" } },
      fill: { fgColor: { rgb: "EEF2FF" } },
    };
    const totalLabelStyle = {
      ...labelStyle,
      fill: { fgColor: { rgb: "EEF2FF" } },
    };

    const header = ["No", "Nama", ...BULAN];
    const rows = exportGroup.members.map((m, i) => {
      const row = [i + 1, m.nama];
      BULAN.forEach((_, month) => {
        const pay = exportGroup.payments[payKey(m.id, yr, month)];
        // Jika sudah bayar: tampilkan NOMINAL SAJA, tanpa tulisan Paid.
        if (pay && pay.status === "paid") row.push(Number(pay.amount || 0));
        else if (pay && pay.status === "leave") row.push("Vacation");
        else row.push("Unpaid");
      });
      return row;
    });

    // Total bulanan tetap dipertahankan karena ini yang dibutuhkan sebagai rekap.
    const totalsRow = ["", "Total Bulanan"];
    let grandIncome = 0;
    BULAN.forEach((_, month) => {
      let t = 0;
      exportGroup.members.forEach((m) => {
        const pay = exportGroup.payments[payKey(m.id, yr, month)];
        if (pay && pay.status === "paid") t += Number(pay.amount || 0);
      });
      grandIncome += t;
      totalsRow.push(t);
    });

    const yearlyExpenses = [...exportGroup.expenses]
      .filter((e) => String(e.date || "").slice(0, 4) === String(yr))
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    const yearlyExpenseTotal = yearlyExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
    const yearlyBalance = Number(exportGroup.openingBalance || 0) + grandIncome - yearlyExpenseTotal;
    const expenseRows = yearlyExpenses.map((e, i) => [i + 1, formatDateID(e.date), e.description || "", Number(e.amount || 0)]);

    // Layout memakai seluruh lebar laporan untuk bagian ringkasan/pengeluaran,
    // supaya Keterangan tidak terjepit di satu kolom kecil.
    const aoa = [
      [`${data.appName} — ${data.appTagline}`],
      [`${exportGroup.name} — Rekap Iuran Tahun ${yr}`],
      [],
      header,
      ...rows,
      totalsRow,
      [],
      ["RINGKASAN KEUANGAN"],
      ["Keterangan", "Nominal"],
      ["Saldo Awal", Number(exportGroup.openingBalance || 0)],
      ["Total Pemasukan Tahun", grandIncome],
      ["Total Pengeluaran Tahun", yearlyExpenseTotal],
      ["Saldo Akhir Tahun", yearlyBalance],
      [],
      ["REKAP PENGELUARAN TAHUN"],
      ["No", "Tanggal", "Keterangan", "Nominal"],
      ...expenseRows,
      ["", "", "Total Pengeluaran", yearlyExpenseTotal],
      [],
      [`Dibuat: ${new Date().toLocaleString("id-ID")}`],
    ];

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const summaryTitleRow = 6 + rows.length;
    const summaryHeaderRow = summaryTitleRow + 1;
    const summaryFirstRow = summaryHeaderRow + 1;
    const summaryLastRow = summaryFirstRow + 3;
    const expenseTitleRow = summaryLastRow + 2;
    const expenseHeaderRow = expenseTitleRow + 1;
    const expenseFirstRow = expenseHeaderRow + 1;
    const expenseLastRow = expenseFirstRow + expenseRows.length - 1;
    const expenseTotalRow = expenseFirstRow + expenseRows.length;
    const maxTableRow = 3 + rows.length;

    // Judul utama + judul section digabung agar tidak terpotong.
    ws["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: lastCol - 1 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: lastCol - 1 } },
      { s: { r: summaryTitleRow, c: 0 }, e: { r: summaryTitleRow, c: lastCol - 1 } },
      { s: { r: summaryHeaderRow, c: 0 }, e: { r: summaryHeaderRow, c: 7 } },
      { s: { r: summaryHeaderRow, c: 8 }, e: { r: summaryHeaderRow, c: lastCol - 1 } },
      { s: { r: summaryFirstRow, c: 0 }, e: { r: summaryFirstRow, c: 7 } },
      { s: { r: summaryFirstRow, c: 8 }, e: { r: summaryFirstRow, c: lastCol - 1 } },
      { s: { r: summaryFirstRow + 1, c: 0 }, e: { r: summaryFirstRow + 1, c: 7 } },
      { s: { r: summaryFirstRow + 1, c: 8 }, e: { r: summaryFirstRow + 1, c: lastCol - 1 } },
      { s: { r: summaryFirstRow + 2, c: 0 }, e: { r: summaryFirstRow + 2, c: 7 } },
      { s: { r: summaryFirstRow + 2, c: 8 }, e: { r: summaryFirstRow + 2, c: lastCol - 1 } },
      { s: { r: summaryFirstRow + 3, c: 0 }, e: { r: summaryFirstRow + 3, c: 7 } },
      { s: { r: summaryFirstRow + 3, c: 8 }, e: { r: summaryFirstRow + 3, c: lastCol - 1 } },
      { s: { r: expenseTitleRow, c: 0 }, e: { r: expenseTitleRow, c: lastCol - 1 } },
      { s: { r: expenseHeaderRow, c: 1 }, e: { r: expenseHeaderRow, c: 2 } },
    ];
    for (let r = expenseFirstRow; r <= expenseTotalRow; r++) {
      ws["!merges"].push(
        { s: { r, c: 1 }, e: { r, c: 2 } },
        { s: { r, c: 3 }, e: { r, c: lastCol - 1 } },
      );
    }

    // Lebar kolom: nama cukup untuk nama anggota, bulan seragam dan ringkas.
    ws["!cols"] = [
      { wch: 5 },
      { wch: 18 },
      ...BULAN.map(() => ({ wch: 9.5 })),
    ];

    const setCell = (r, c, style, valueIfMissing = "") => {
      const addr = `${colLetter(c + 1)}${r + 1}`;
      if (!ws[addr]) ws[addr] = { t: "s", v: valueIfMissing };
      ws[addr].s = style;
    };

    // Main table.
    for (let c = 0; c < lastCol; c++) setCell(3, c, headerStyle);
    for (let r = 4; r <= maxTableRow; r++) {
      for (let c = 0; c < lastCol; c++) {
        const val = ws[`${colLetter(c + 1)}${r + 1}`]?.v;
        if (c === 0) setCell(r, c, centerStyle);
        else if (typeof val === "number") setCell(r, c, moneyStyle);
        else if (c === 1) setCell(r, c, bodyStyle);
        else setCell(r, c, centerStyle);
      }
    }
    for (let c = 0; c < lastCol; c++) setCell(maxTableRow + 1, c, moneyBoldStyle);
    setCell(maxTableRow + 1, 1, totalLabelStyle);

    // Summary: Keterangan lebar (A:H), Nominal lebar (I:N), semua diborder.
    for (let c = 0; c < lastCol; c++) setCell(summaryTitleRow, c, sectionStyle);
    for (let c = 0; c < 8; c++) setCell(summaryHeaderRow, c, headerStyle);
    for (let c = 8; c < lastCol; c++) setCell(summaryHeaderRow, c, headerStyle);
    for (let r = summaryFirstRow; r <= summaryLastRow; r++) {
      for (let c = 0; c < 8; c++) setCell(r, c, labelStyle);
      for (let c = 8; c < lastCol; c++) setCell(r, c, moneyStyle);
    }

    // Expense: No | Tanggal (B:C) | Keterangan (D:N-1) | Nominal (N).
    for (let c = 0; c < lastCol; c++) setCell(expenseTitleRow, c, sectionStyle);
    setCell(expenseHeaderRow, 0, headerStyle);
    for (let c = 1; c <= 2; c++) setCell(expenseHeaderRow, c, headerStyle);
    for (let c = 3; c < lastCol; c++) setCell(expenseHeaderRow, c, headerStyle);
    for (let r = expenseFirstRow; r <= expenseLastRow; r++) {
      setCell(r, 0, centerStyle);
      for (let c = 1; c <= 2; c++) setCell(r, c, bodyStyle);
      for (let c = 3; c < lastCol - 1; c++) setCell(r, c, bodyStyle);
      setCell(r, lastCol - 1, moneyStyle);
    }
    for (let c = 0; c < lastCol; c++) setCell(expenseTotalRow, c, c === lastCol - 1 ? moneyBoldStyle : totalLabelStyle);

    // Judul/subjudul.
    for (let c = 0; c < lastCol; c++) setCell(0, c, titleStyle);
    for (let c = 0; c < lastCol; c++) setCell(1, c, subtitleStyle);

    const rowHeights = [];
    rowHeights[0] = { hpt: 28 };
    rowHeights[1] = { hpt: 22 };
    rowHeights[2] = { hpt: 8 };
    rowHeights[3] = { hpt: 24 };
    for (let r = 4; r <= maxTableRow + 1; r++) rowHeights[r] = { hpt: 21 };
    rowHeights[summaryTitleRow] = { hpt: 22 };
    rowHeights[summaryHeaderRow] = { hpt: 24 };
    for (let r = summaryFirstRow; r <= summaryLastRow; r++) rowHeights[r] = { hpt: 22 };
    rowHeights[expenseTitleRow] = { hpt: 22 };
    rowHeights[expenseHeaderRow] = { hpt: 24 };
    for (let r = expenseFirstRow; r <= expenseTotalRow; r++) rowHeights[r] = { hpt: 22 };
    ws["!rows"] = rowHeights;

    ws["!autofilter"] = { ref: `A4:${lastColLetter}${maxTableRow + 1}` };
    ws["!pageSetup"] = { orientation: "landscape", paperSize: 9, fitToWidth: 1, fitToHeight: 0 };
    ws["!margins"] = { left: 0.2, right: 0.2, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 };
    ws["!sheetPr"] = { pageSetUpPr: { fitToPage: true } };

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, exportGroup.name.slice(0, 28));
    const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array", cellStyles: true });
    const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    setExportLinks((prev) => [
      { id: uid("xls"), kind: "excel", filename: `maestro-${groupKey}-${yr}.xlsx`, url },
      ...prev,
    ]);
  };

  // ---- Backup / Restore ----
  const [backupMsg, setBackupMsg] = useState("");
  const handleBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const filename = `maestro-backup-${todayISO()}.json`;
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setBackupMsg(`Backup "${filename}" sudah diunduh — cek folder Downloads/Files di HP kamu.`);
    logActivity("Backup data diunduh");
  };

  const handleRestoreFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.groups || !parsed.auth) throw new Error("format tidak valid");
        setData({ ...emptyData, ...parsed });
        setRestoreMsg("Data berhasil dipulihkan.");
        logActivity("Data dipulihkan dari file backup");
      } catch (err) {
        setRestoreMsg("Gagal memulihkan: file tidak valid.");
      }
    };
    reader.readAsText(file);
  };

      ctx.fillText(c[0].toUpperCase(), x + 12, y + 20);
      ctx.fillStyle = c[2]; ctx.font = "700 18px 'Plus Jakarta Sans', sans-serif";
      ctx.fillText(c[1], x + 12, y + 45);
    });

    // Table header
    let y = 195;
    ctx.fillStyle = "#1E293B"; ctx.font = "700 12px Inter, sans-serif";
    ctx.fillText("No", 24, y);
    ctx.fillText("Tanggal", 60, y);
    ctx.fillText("Keterangan", 165, y);
    ctx.fillText("Nominal", 560, y);
    y += 10;
    ctx.strokeStyle = "#E2E8F0"; ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(W - 24, y); ctx.stroke();

    pageExpenses.forEach((e, idx) => {
      const ry = y + 22 + idx * rowH;
      const globalIdx = allTimeExpenseIndex(e) ;
      ctx.fillStyle = "#334155"; ctx.font = "500 12px Inter, sans-serif";
      ctx.fillText(String(globalIdx), 24, ry);
      ctx.fillText(formatDateID(e.date), 60, ry);
      const desc = e.description.length > 42 ? e.description.slice(0, 41) + "…" : e.description;
      ctx.fillText(desc, 165, ry);
      ctx.fillStyle = "#DC2626"; ctx.font = "600 12px Inter, sans-serif";
      ctx.fillText(formatRupiah(e.amount), 560, ry);
      ctx.strokeStyle = "#F1F5F9"; ctx.beginPath(); ctx.moveTo(24, ry + 8); ctx.lineTo(W - 24, ry + 8); ctx.stroke();
    });

    // Footer
    let fy = topH + pageExpenses.length * rowH + 20;
    ctx.strokeStyle = "#CBD5E1"; ctx.beginPath(); ctx.moveTo(24, fy - 14); ctx.lineTo(W - 24, fy - 14); ctx.stroke();
    ctx.font = "700 13px 'Plus Jakarta Sans', sans-serif"; ctx.fillStyle = "#DC2626";

    ctx.arcTo(x + w, y + h, x, y + h, r);

            </div>

            <div className="bg-white rounded-xl shadow-sm p-3.5">
              <p className="text-xs font-semibold mb-2" style={{ color: "#94A3B8" }}>PENGATURAN {group.name.toUpperCase()}</p>
              <label className="text-xs" style={{ color: "#94A3B8" }}>Nama Grup</label>
              <input value={group.name} onChange={(e) => updateGroup(() => ({ name: e.target.value }))}
                className="w-full border rounded-lg px-3 py-2 text-sm mb-2.5 mt-1 outline-none" style={{ borderColor: "#E2E8F0" }} />
              <label className="text-xs" style={{ color: "#94A3B8" }}>Nominal Iuran Default</label>
              <input value={group.defaultAmount} onChange={(e) => {
                  const v = parseFloat(e.target.value.replace(/[^0-9.-]/g, "")) || 0;
                  const old = group.defaultAmount;
                  updateGroup(() => ({ defaultAmount: v }));
                  if (v !== old) logActivity(`Nominal iuran ${group.name} diubah dari ${formatRupiah(old)} ke ${formatRupiah(v)}`);
                }}
                className="w-full border rounded-lg px-3 py-2 text-sm mb-2.5 mt-1 outline-none" style={{ borderColor: "#E2E8F0" }} />
              <label className="text-xs" style={{ color: "#94A3B8" }}>Saldo Awal</label>
              <input value={group.openingBalance} onChange={(e) => updateGroup(() => ({ openingBalance: parseFloat(e.target.value.replace(/[^0-9.-]/g, "")) || 0 }))}
                className="w-full border rounded-lg px-3 py-2 text-sm mb-2.5 mt-1 outline-none" style={{ borderColor: "#E2E8F0" }} />
              <label className="text-xs" style={{ color: "#94A3B8" }}>Keterangan Saldo Awal (opsional)</label>
              <input value={group.openingBalanceNote || ""} onChange={(e) => updateGroup(() => ({ openingBalanceNote: e.target.value }))}
                placeholder='misal: "Saldo sisa tahun 2025"'
                className="w-full border rounded-lg px-3 py-2 text-sm mt-1 outline-none" style={{ borderColor: "#E2E8F0" }} />
            </div>

            <div className="bg-white rounded-xl shadow-sm p-3.5">
              <p className="text-xs font-semibold mb-2" style={{ color: "#94A3B8" }}>PENYIMPANAN CLOUD (SUPABASE)</p>
              <p className="text-xs mb-2" style={{ color: "#64748B" }}>
                Status: <span style={{ fontWeight: 600, color: syncStatus === "error" ? "#DC2626" : "#16A34A" }}>
                  {syncStatus === "error" ? "Gagal sinkron" : syncStatus === "saving" ? "Menyimpan…" : "Tersambung"}
                </span>
              </p>
              <p className="text-xs mb-3 break-all" style={{ color: "#94A3B8" }}>{supaConfig ? supaConfig.url : "-"}</p>
              <button onClick={() => {
                  if (confirm("Putuskan koneksi Supabase di device ini? Kamu perlu masukkan URL & key lagi untuk lanjut pakai aplikasi.")) {
                    localStorage.removeItem(SUPABASE_CONFIG_KEY);
                    setSupaConfig(null);
                  }
                }}
                className="w-full py-2.5 rounded-lg text-sm font-semibold" style={{ background: "#FEF2F2", color: "#DC2626" }}>
                Putuskan / Ganti Koneksi Supabase
              </button>
            </div>

            <div className="bg-white rounded-xl shadow-sm p-3.5">
              <p className="text-xs font-semibold mb-2" style={{ color: "#94A3B8" }}>AKUN LOGIN</p>
              <label className="text-xs" style={{ color: "#94A3B8" }}>Username</label>
              <input value={data.auth.username} onChange={(e) => setData((d) => ({ ...d, auth: { ...d.auth, username: e.target.value } }))}
                className="w-full border rounded-lg px-3 py-2 text-sm mb-2.5 mt-1 outline-none" style={{ borderColor: "#E2E8F0" }} />
              <label className="text-xs" style={{ color: "#94A3B8" }}>Password</label>
              <input value={data.auth.password} onChange={(e) => setData((d) => ({ ...d, auth: { ...d.auth, password: e.target.value } }))}
                className="w-full border rounded-lg px-3 py-2 text-sm mt-1 outline-none" style={{ borderColor: "#E2E8F0" }} />
              <p className="text-xs mt-2" style={{ color: "#CBD5E1" }}>Login ini disimpan di penyimpanan browser HP kamu (localStorage), bukan sistem autentikasi server sungguhan. Kalau cache browser di-clear, username/password ini ikut ke-reset ke admin/admin123.</p>
            </div>

          </div>
        )}

        {syncStatus === "saving" && <p className="text-xs mt-3 text-center" style={{ color: "#94A3B8" }}>Menyimpan ke cloud…</p>}
        {syncStatus === "error" && <p className="text-xs mt-3 text-center" style={{ color: "#DC2626" }}>Gagal sinkron ke Supabase. Data tetap tersimpan di HP ini, akan dicoba lagi otomatis.</p>}
      </div>

      {/* Bottom nav */}
      <div className="maestro-bottom-nav fixed bottom-0 left-0 right-0 bg-white border-t flex z-40" style={{ borderColor: "#E2E8F0" }}>
        {[
          ["dashboard", "🏠", "Beranda"],
          ["expenses", "💸", "Pengeluaran"],
          ["reports", "📊", "Rekap"],
          ["settings", "⚙️", "Pengaturan"],
        ].map(([key, emoji, label]) => (
          <button key={key} onClick={() => setTab(key)} className="flex-1 flex flex-col items-center py-2.5 gap-0.5">
            <span style={{ fontSize: 18, opacity: tab === key ? 1 : 0.55 }}>{emoji}</span>
            <span className="text-[11px] font-semibold" style={{ color: tab === key ? "#4F46E5" : "#94A3B8" }}>{label}</span>
          </button>
        ))}
      </div>

      {/* Member action modal */}
      {modalMember && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background: "rgba(15,23,42,0.45)" }} onClick={() => setMemberModal(null)}>
          <div className="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-sm p-5" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-1">
              <h3 className="text-base font-bold" style={{ fontFamily: "'Plus Jakarta Sans',sans-serif" }}>{modalMember.nama}</h3>
              <button onClick={() => setMemberModal(null)}>✕</button>
            </div>
            <p className="text-xs mb-3" style={{ color: "#94A3B8" }}>{BULAN_FULL[selectedMonth]} {selectedYear} · {group.name}</p>

            {modalMember.status !== "unpaid" && (
              <div className="rounded-xl p-3 mb-3 flex items-center justify-between" style={{ background: STATUS_STYLE[modalMember.status].bg }}>
                <div>
                  <p className="text-xs font-semibold" style={{ color: STATUS_STYLE[modalMember.status].fg }}>
                    Status saat ini: {STATUS_STYLE[modalMember.status].label}
                  </p>
                  {modalMember.status === "paid" && (
                    <p className="text-xs mt-0.5" style={{ color: STATUS_STYLE[modalMember.status].fg }}>
                      {formatRupiah(modalMember.amount)}
                    </p>
                  )}
                </div>
              </div>
            )}

            {modalMember.status === "unpaid" ? (
              <>
                <button onClick={() => markPaid(modalMember.id, modalMember.nama, group.defaultAmount)}
                  className="w-full py-3 rounded-xl text-sm font-semibold mb-2 text-white" style={{ background: "#16A34A" }}>
                  ✓ Tandai Lunas — {formatRupiah(group.defaultAmount)}
                </button>

                {!useCustom ? (
                  <button onClick={() => setUseCustom(true)} className="w-full py-2.5 rounded-xl text-sm font-medium mb-2 border" style={{ borderColor: "#E2E8F0", color: "#4F46E5" }}>
                    Gunakan Nominal Custom
                  </button>
                ) : (
                  <div className="flex gap-2 mb-2">
                    <input value={customAmount} onChange={(e) => setCustomAmount(e.target.value)} placeholder="Nominal custom" inputMode="numeric"
                      className="flex-1 border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#E2E8F0" }} />
                    <button onClick={() => {
                        const n = parseFloat(String(customAmount).replace(/[^0-9.-]/g, ""));
                        if (n > 0) markPaid(modalMember.id, modalMember.nama, n);
                      }}
                      className="px-4 rounded-xl text-white text-sm font-semibold" style={{ background: "#4F46E5" }}>
                      Simpan
                    </button>
                  </div>
                )}

                <button onClick={() => markLeave(modalMember.id, modalMember.nama)}
                  className="w-full py-2.5 rounded-xl text-sm font-semibold" style={{ background: "#FEF3C7", color: "#B45309" }}>
                  Tandai Vacation
                </button>
              </>
            ) : (
              <>
                <button onClick={() => markUnpaid(modalMember.id, modalMember.nama)}
                  className="w-full py-3 rounded-xl text-sm font-semibold mb-2 text-white" style={{ background: "#DC2626" }}>
                  ↺ Batalkan — jadi Belum Bayar
                </button>
                <p className="text-xs text-center mb-2" style={{ color: "#CBD5E1" }}>Salah pencet? Klik tombol di atas untuk membatalkan, lalu tandai ulang dengan benar.</p>

                {modalMember.status === "leave" && (
                  <button onClick={() => markPaid(modalMember.id, modalMember.nama, group.defaultAmount)}
                    className="w-full py-2.5 rounded-xl text-sm font-semibold" style={{ background: "#DCFCE7", color: "#15803D" }}>
                    Ubah jadi Lunas — {formatRupiah(group.defaultAmount)}
                  </button>
                )}
                {modalMember.status === "paid" && (
                  <button onClick={() => markLeave(modalMember.id, modalMember.nama)}
                    className="w-full py-2.5 rounded-xl text-sm font-semibold" style={{ background: "#FEF3C7", color: "#B45309" }}>
                    Ubah jadi Vacation
                  </button>
                )}
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function ExportLinksPanel({ exportLinks, setExportLinks }) {
  if (exportLinks.length === 0) return null;
  return (
    <div className="bg-white rounded-xl shadow-sm p-3 mb-5">
      <p className="text-xs font-semibold mb-2" style={{ color: "#94A3B8" }}>FILE SIAP DISIMPAN</p>
      <div className="flex flex-col gap-2">
        {exportLinks.map((f) => (
          <div key={f.id} className="flex items-center gap-2.5 border rounded-lg p-2" style={{ borderColor: "#E2E8F0" }}>
            {f.kind === "png" ? (
              <img src={f.url} alt={f.filename} className="w-12 h-16 object-cover rounded" style={{ border: "1px solid #E2E8F0" }} />
            ) : (
              <div className="w-10 h-10 rounded flex items-center justify-center" style={{ background: "#EEF2FF" }}>
                ⬇️
              </div>
            )}
            <div className="flex-1 min-w-0">
              <p className="text-xs font-medium truncate">{f.filename}</p>
              {f.kind === "png" && <p className="text-xs" style={{ color: "#CBD5E1" }}>Tekan &amp; tahan gambar untuk simpan ke galeri</p>}
            </div>
            <a href={f.url} download={f.filename} target="_blank" rel="noreferrer"
              className="px-3 py-1.5 rounded-lg text-xs font-semibold text-white shrink-0" style={{ background: "#4F46E5" }}>
              Simpan
            </a>
          </div>
        ))}
        <button onClick={() => setExportLinks([])} className="text-xs mt-1 self-start" style={{ color: "#94A3B8" }}>
          Bersihkan daftar
        </button>
      </div>
    </div>
  );
}

function StatusMini({ label, value, bg, fg }) {
  return (
    <div className="rounded-xl p-2.5 text-center" style={{ background: bg }}>
      <p className="text-[10px] font-semibold" style={{ color: fg }}>{label}</p>
      <p className="text-lg font-extrabold mt-0.5" style={{ color: fg, fontFamily: "'Plus Jakarta Sans',sans-serif" }}>{value}</p>
    </div>
  );
}

function BigCard({ icon, label, value, bg, full }) {
  return (
    <div className={`rounded-xl p-3.5 ${full ? "col-span-2" : ""}`} style={{ background: bg }}>
      <div className="flex items-center gap-1.5 mb-1.5 opacity-90">
        {icon}
        <span className="text-xs font-semibold text-white uppercase tracking-wide">{label}</span>
      </div>
      <p className="text-lg font-extrabold text-white" style={{ fontFamily: "'Plus Jakarta Sans',sans-serif" }}>{value}</p>
    </div>
  );
}

function SummaryCard({ label, value, color }) {
  return (
    <div className="bg-white rounded-lg p-2.5 shadow-sm">
      <p className="text-xs font-semibold uppercase" style={{ color: "#94A3B8" }}>{label}</p>
      <p className="text-sm font-bold" style={{ color }}>{value}</p>
    </div>
  );
}

function ReportRow({ label, value, color, bold }) {
  return (
    <div className="flex justify-between items-center py-1.5">
      <span className="text-sm" style={{ color: "#64748B" }}>{label}</span>
      <span className={bold ? "text-base font-bold" : "text-sm font-semibold"} style={{ color }}>{value}</span>
    </div>
  );
}

function MemberLine({ idx, m }) {
  const st = STATUS_STYLE[m.status];
  return (
    <div className="flex items-center justify-between py-1.5 border-b last:border-0" style={{ borderColor: "#F8FAFC" }}>
      <span className="text-xs flex-1"><span style={{ color: "#CBD5E1" }}>{idx}.</span> {m.nama}</span>
      <span className="text-xs font-semibold px-2 py-0.5 rounded-full mr-2" style={{ background: st.bg, color: st.fg }}>{st.label}</span>
      <span className="text-xs w-20 text-right" style={{ color: "#64748B" }}>{m.status === "paid" ? formatRupiah(m.amount) : "-"}</span>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Maestro />);
</script>
</body>
</html>
